name: publicar

on:
  push:
    branches: [main]
  # Também publica à mão. Um site de aniversário não pode depender de
  # alguém lembrar de apertar o botão na hora certa.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. Duas builds do Pages ao mesmo tempo publicam o site
# pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Tipos
        working-directory: site
        run: npm ci && npm run typecheck

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Caracteres corrompidos
        working-directory: site
        run: python3 scripts/check-corrupcao.py src

      # `verificar.yml` já cobre build e auditoria. Aqui o build roda de novo
      # de propósito: o Pages não deve publicar um commit que não passou em
      # nada, e as duas workflows podem disparar em paralelo.
      - name: Build
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4